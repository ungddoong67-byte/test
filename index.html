<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 컨테이너 이미지 풀페이지 스크롤</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Pretendard', sans-serif;
    }

    /* 스크롤 스냅 컨테이너 */
    .container {
      width: 100%;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    /* 각 섹션 공통 스타일 */
    .section {
      position: relative;
      width: 100%;
      height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: #ffffff;
      overflow: hidden; /* 이미지 돌출 방지 */
    }

    /* 섹션에 꽉 채우는 img 태그 스타일 (선명도 강화 설정 추가) */
    .section-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* 비율을 유지하면서 요소 전체에 꽉 채움 */
      object-position: center;
      z-index: 0;

      /* -------------------------------------------------------------
         [사진 선명하게 처리하는 핵심 CSS 속성]
      ------------------------------------------------------------- */
      /* 1. 이미지 확대/축소 시 픽셀 경계를 또렷하게 보정 */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;

      /* 2. 그래픽 가속 및 이미지 변형 시 렌더링 품질 극대화 */
      image-rendering: high-quality;
      transform: translateZ(0); /* 하드웨어 가속을 통해 앤티앨리어싱 선명화 */

      /* 3. 대비(contrast)를 5~10% 살짝 올려 윤곽을 또렷하게 만듦 */
      filter: contrast(105%) brightness(102%);
    }

    /* 이미지 위에 어두운 덮개를 씌워 글자를 잘 보이게 설정 */
    .section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4); /* 어둡기 조절 (0.4 = 40%) */
      z-index: 1;
    }

    /* 텍스트 내용이 오버레이 위에 오도록 설정 */
    .content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .content h1 {
      font-size: 3.5rem;
      font-weight: 800;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .content p {
      font-size: 1.3rem;
      margin-top: 15px;
      opacity: 0.9;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    /* 우측 네비게이션 인디케이터 */
    .nav-dots {
      position: fixed;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 100;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active {
      background-color: #ffffff;
      transform: scale(1.4);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>

  <!-- 오른쪽 도트 네비게이션 -->
  <div class="nav-dots">
    <div class="dot active" onclick="scrollToSection(0)"></div>
    <div class="dot" onclick="scrollToSection(1)"></div>
    <div class="dot" onclick="scrollToSection(2)"></div>
    <div class="dot" onclick="scrollToSection(3)"></div>
    <div class="dot" onclick="scrollToSection(4)"></div>
    <div class="dot" onclick="scrollToSection(5)"></div>
    <div class="dot" onclick="scrollToSection(6)"></div>
  </div>

  <!-- 7개 섹션 컨테이너 -->
  <div class="container" id="mainContainer">
    <section class="section" id="section1">
      <img src="images/pb1.png" alt="사진 1" class="section-img">
      <div class="content">
        <h1>Container 01</h1>
        <p>첫 번째 이미지 섹션입니다.</p>
      </div>
    </section>

    <section class="section" id="section2">
      <img src="images/pb2.png" alt="사진 2" class="section-img">
      <div class="content">
        <h1>Container 02</h1>
        <p>두 번째 이미지 섹션입니다.</p>
      </div>
    </section>

    <section class="section" id="section3">
      <img src="images/pb3.png" alt="사진 3" class="section-img">
      <div class="content">
        <h1>Container 03</h1>
        <p>세 번째 이미지 섹션입니다.</p>
      </div>
    </section>

    <section class="section" id="section4">
      <img src="images/pb4.png" alt="사진 4" class="section-img">
      <div class="content">
        <h1>Container 04</h1>
        <p>네 번째 이미지 섹션입니다.</p>
      </div>
    </section>

    <section class="section" id="section5">
      <img src="images/pb5.png" alt="사진 5" class="section-img">
      <div class="content">
        <h1>Container 05</h1>
        <p>다섯 번째 이미지 섹션입니다.</p>
      </div>
    </section>

    <section class="section" id="section6">
      <img src="images/pb6.png" alt="사진 6" class="section-img">
      <div class="content">
        <h1>Container 06</h1>
        <p>여섯 번째 이미지 섹션입니다.</p>
      </div>
    </section>

    <section class="section" id="section7">
      <div class="content">
        <h1>Container 07</h1>
        <p>일곱 번째 마지막 이미지 섹션입니다.</p>
      </div>
    </section>
  </div>
  
  <script>
    const container = document.getElementById('mainContainer');
    const sections = document.querySelectorAll('.section');
    const dots = document.querySelectorAll('.dot');
    let isScrolling = false;

    // 점 클릭 시 이동
    function scrollToSection(index) {
      sections[index].scrollIntoView({ behavior: 'smooth' });
    }

    // 스크롤 감지 및 활성 점 표시
    container.addEventListener('scroll', () => {
      const scrollPosition = container.scrollTop;
      const windowHeight = window.innerHeight;

      sections.forEach((section, index) => {
        const sectionTop = section.offsetTop;
        if (scrollPosition >= sectionTop - windowHeight / 3) {
          dots.forEach(dot => dot.classList.remove('active'));
          dots[index].classList.add('active');
        }
      });
    });

    // 마우스 휠 1섹션씩 이동 제어
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (isScrolling) return;

      const delta = e.deltaY;
      const currentScroll = container.scrollTop;
      const windowHeight = window.innerHeight;
      let targetIndex = Math.round(currentScroll / windowHeight);

      if (delta > 0) {
        targetIndex = Math.min(targetIndex + 1, sections.length - 1);
      } else {
        targetIndex = Math.max(targetIndex - 1, 0);
      }

      isScrolling = true;
      scrollToSection(targetIndex);

      setTimeout(() => {
        isScrolling = false;
      }, 700);
    }, { passive: false });
  </script>
</body>
</html>
