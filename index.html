<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 컨테이너 이미지 풀페이지 스크롤</title>
  <style>
    @font-face {
      font-family: 'Godo-M';
      font-style: normal;
      font-weight: 400;
      src: url('//cdn.jsdelivr.net/korean-webfonts/1/corps/godo/Godo/GodoM.woff2') format('woff2'),
           url('//cdn.jsdelivr.net/korean-webfonts/1/corps/godo/Godo/GodoM.woff') format('woff');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Godo-M', 'Pretendard', sans-serif;
    }

    /* 스크롤 스냅 컨테이너 */
    .container {
      width: 100%;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    /* 각 섹션 공통 스타일 */
    .section {
      position: relative;
      width: 100vw;
      height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: #ffffff;
      overflow: hidden; /* 이미지 돌출 방지 */
    }

    /* 섹션에 꽉 채우는 img 태그 스타일 (창 크기 맞춤 최적화) */
    .section-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* 화면 창 비율에 맞춰 빈틈없이 꽉 채움 */
      object-position: center; /* 이미지의 중앙을 기준으로 맞춤 */
      z-index: 0;

      /* -------------------------------------------------------------
         [사진 선명하게 처리하는 핵심 CSS 속성]
      ------------------------------------------------------------- */
      /* 1. 이미지 확대/축소 시 픽셀 경계를 또렷하게 보정 */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;

      /* 2. 그래픽 가속 및 이미지 변형 시 렌더링 품질 극대화 */
      image-rendering: high-quality;
      transform: translateZ(0); /* 하드웨어 가속을 통해 앤티앨리어싱 선명화 */

      /* 3. 대비(contrast)를 5~10% 살짝 올려 윤곽을 또렷하게 만듦 */
      filter: contrast(105%) brightness(102%);
    }

    /* 텍스트 내용 상단 중앙 배치 설정 */
    .content {
      position: absolute;
      top: 80px; /* 상단에서 떨어진 거리 (원하시는 만큼 수치 조절 가능) */
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      text-align: center;
      width: 100%;
    }

    .content h1 {
      font-size: 3.5rem;
      font-weight: 800;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .content p {
      font-size: 1.3rem;
      margin-top: 15px;
      opacity: 0.9;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

  </style>
</head>
<body>

  <!-- 7개 섹션 컨테이너 -->
  <div class="container" id="mainContainer">
    <section class="section" id="section1">
      <picture>
        <source media="(max-width: 768px)" srcset="images/m_pb1.png">
        <img src="images/pb1.png" alt="사진 1" class="section-img">
      </picture>
      <div class="content">
        <h1>도봉동퀵서비스</h1>
      </div>
    </section>

    <section class="section" id="section2">
      <picture>
        <source media="(max-width: 768px)" srcset="images/m_pb2.png">
        <img src="images/pb2.png" alt="사진 2" class="section-img">
      </picture>
    </section>

    <section class="section" id="section3">
      <picture>
        <source media="(max-width: 768px)" srcset="images/m_pb3.png">
        <img src="images/pb3.png" alt="사진 3" class="section-img">
      </picture>
    </section>

    <section class="section" id="section4">
      <picture>
        <source media="(max-width: 768px)" srcset="images/m_pb4.png">
        <img src="images/pb4.png" alt="사진 4" class="section-img">
      </picture>
    </section>

    <section class="section" id="section5">
      <picture>
        <source media="(max-width: 768px)" srcset="images/m_pb5.png">
        <img src="images/pb5.png" alt="사진 5" class="section-img">
      </picture>
    </section>

    <section class="section" id="section6">
      <picture>
        <source media="(max-width: 768px)" srcset="images/m_pb6.png">
        <img src="images/pb6.png" alt="사진 6" class="section-img">
      </picture>
    </section>

    <section class="section" id="section7">
      <div class="content">
        <h1>Container 07</h1>
        <p>일곱 번째 마지막 이미지 섹션입니다.</p>
      </div>
    </section>
  </div>

  <script>
    const container = document.getElementById('mainContainer');
    const sections = document.querySelectorAll('.section');
    const dots = document.querySelectorAll('.dot');
    let isScrolling = false;

    // 점 클릭 시 이동
    function scrollToSection(index) {
      sections[index].scrollIntoView({ behavior: 'smooth' });
    }

    // 스크롤 감지 및 활성 점 표시
    container.addEventListener('scroll', () => {
      const scrollPosition = container.scrollTop;
      const windowHeight = window.innerHeight;

      sections.forEach((section, index) => {
        const sectionTop = section.offsetTop;
        if (scrollPosition >= sectionTop - windowHeight / 3) {
          dots.forEach(dot => dot.classList.remove('active'));
          dots[index].classList.add('active');
        }
      });
    });

    // 마우스 휠 1섹션씩 이동 제어
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (isScrolling) return;

      const delta = e.deltaY;
      const currentScroll = container.scrollTop;
      const windowHeight = window.innerHeight;
      let targetIndex = Math.round(currentScroll / windowHeight);

      if (delta > 0) {
        targetIndex = Math.min(targetIndex + 1, sections.length - 1);
      } else {
        targetIndex = Math.max(targetIndex - 1, 0);
      }

      isScrolling = true;
      scrollToSection(targetIndex);

      setTimeout(() => {
        isScrolling = false;
      }, 700);
    }, { passive: false });
  </script>
</body>
</html>
